[project]
name = "krubit"
version = "0.1.0"
description = "Zariya's non-conversational Discord companion and operations bot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite==0.22.1",
  "discord.py==2.7.1",
  "truststore==0.10.4",
]

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=9.0,<10",
  "pytest-asyncio==1.4.0",
  "ruff>=0.12",
]

[project.scripts]
krubit = "krubit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
